name: AStyle Format Check

permissions:
  contents: read

on:
  push:
    paths-ignore:
      - '**/*.md'
      - '**/00-RELEASENOTES'
      - '**/COPYING'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/00-RELEASENOTES'
      - '**/COPYING'

concurrency:
  group: astyle-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  astyle-format-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install AStyle
        run: |
          sudo apt-get update -y
          sudo apt-get install astyle -y

      - name: Run astyle
        id: astyle
        run: |
          cd src
          astyle --options=.astylerc --formatted --recursive '*.c' '*.h' '*.cpp' '*.hpp'
          # Capture the diff output
          DIFF=$(git diff)
          if [ ! -z "$DIFF" ]; then
            # Encode the diff in Base64 to ensure it's handled as a single line
            ENCODED_DIFF=$(echo "$DIFF" | base64 -w 0)
            echo "diff=$ENCODED_DIFF" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Check for formatting changes
        if: ${{ steps.astyle.outputs.diff }}
        run: |
          echo "ERROR: Code is not formatted correctly. Here is the diff:"
          echo "${{ steps.astyle.outputs.diff }}" | base64 --decode
          exit 1
        shell: bash
