\* TLC config for ValkeyRaft.tla.
\* 5 servers = 3 voters + 2 learners: the smallest instance for the Lean F2
\* trace (two ADD_VOTERs). Flags at their code values (f482dea); see the
\* calibration table at the end of ValkeyRaft.tla for the runs to make.
\* The state space with a 5-server message bag is large: for calibration,
\* consider TLC simulation mode (-simulate) or tighter bounds first.
\* Servers are TYPED model values (s_ prefix, see ValkeyRaftBase); Value and
\* Nil are ordinary model values.
CONSTANTS
    Server = {s_1, s_2, s_3, s_4, s_5}
    Value = {v1}
    InitVoters = {s_1, s_2, s_3}
    InitLeader = s_1
    Nil = Nil
    MaxTerm = 3
    MaxLogLen = 4
    \* Messages in flight (StateConstraint). A pre-vote or vote broadcast
    \* to 2 other voters needs 2; leaders may resend AE at any time.
    MaxMessages = 4

    AckLastIndex = TRUE
    FollowerCommitLast = TRUE
    ConfigOnAppend = FALSE
    ConfigGuard = "None"
    NoopOnElection = TRUE
    DelVoterReadsLeader = TRUE
    LeaderSelfCount = TRUE

INIT Init
NEXT Next
CONSTRAINT StateConstraint
\* Safety only. Remove for any liveness check.
SYMMETRY Symmetry

\* Keep INVARIANTS last: `make canary` replaces everything from here down.
INVARIANTS
    TypeOK
    StagedUntouched
    MessagesWellFormed
    ElectionSafety
    LogMatching
    CommitWithinLog
    LearnerRoleMatches
    StateMachineSafety
    LeaderCompleteness
    CommittedUnique
    ConfigAgreement
\* IndexBounds is omitted here: it is expected to fail under the code
\* defaults (AckLastIndex = TRUE, B-10). Use it in the C10 case.
