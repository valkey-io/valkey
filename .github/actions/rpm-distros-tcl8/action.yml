name: 'Install TCL8'
description: 'Installs TCL 8.6.16 from source on Fedora-based or uses the system package on others.'

inputs:
  matrix_name:
    description: 'The name of the matrix to check for fedora'
    required: true

runs:
  using: "composite"
  steps:
    - run: |
        if [[ "${{ inputs.matrix_name }}" =~ "fedora" ]]; then
            curl -L -o tcl8.6.16-src.tar.gz https://zenlayer.dl.sourceforge.net/project/tcl/Tcl/8.6.16/tcl8.6.16-src.tar.gz
            tar -xzvf tcl8.6.16-src.tar.gz
            pushd tcl8.6.16/unix
            ./configure --prefix=/opt/tcl8.6
            make -j$(nproc)
            make install
            popd
        else
            dnf -y install tcl
        fi
        dnf -y install tcltls
        ./utils/gen-test-certs.sh
      shell: bash

