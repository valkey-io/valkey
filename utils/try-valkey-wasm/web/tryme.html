  SET: a => { argc(a, 2, 'set'); const [k, v, ...o] = a; let exp = 0, nx = false, xx = false;
    for (let i = 0; i < o.length; i++) { const f = o[i].toUpperCase(); if (f === 'EX') exp = nowMs() + parseInt(o[++i]) * 1000; else if (f === 'PX') exp = nowMs() + parseInt(o[++i]); else if (f === 'NX') nx = true; else if (f === 'XX') xx = true; else throw R.err('ERR syntax error'); }
    const e = live(k); if ((nx && e) || (xx && !e)) return R.nil; DB.set(k, {type: 'string', v, exp}); return R.ok; },
  GET: a => { argc(a, 1, 'get'); const e = needType(a[0], 'string'); return e ? R.bulk(e.v) : R.nil; },
  DEL: a => { argc(a, 1, 'del'); let n = 0; a.forEach(k => { if (live(k)) { DB.delete(k); n++; } }); return R.int(n); },
  EXISTS: a => { argc(a, 1, 'exists'); return R.int(a.filter(k => live(k)).length); },
  INCR: a => { argc(a, 1, 'incr'); return CMDS.INCRBY([a[0], '1']); },
  DECR: a => { argc(a, 1, 'decr'); return CMDS.INCRBY([a[0], '-1']); },
  INCRBY: a => { argc(a, 2, 'incrby'); const e = needType(a[0], 'string'); const cur = e ? e.v : '0';
    if (!/^-?\d+$/.test(cur) || !/^-?\d+$/.test(a[1])) throw R.err('ERR value is not an integer or out of range');
    const v = BigInt(cur) + BigInt(a[1]); DB.set(a[0], {type: 'string', v: v.toString(), exp: e ? e.exp : 0}); return R.int(Number(v)); },
  KEYS: a => { argc(a, 1, 'keys'); return R.arr([...DB.keys()].filter(k => live(k) && glob(a[0], k)).sort().map(R.bulk)); },
  TTL: a => { argc(a, 1, 'ttl'); const e = live(a[0]); return R.int(!e ? -2 : !e.exp ? -1 : Math.max(0, Math.round((e.exp - nowMs()) / 1000))); },
  PTTL: a => { argc(a, 1, 'pttl'); const e = live(a[0]); return R.int(!e ? -2 : !e.exp ? -1 : Math.max(0, e.exp - nowMs())); },
  EXPIRE: a => { argc(a, 2, 'expire'); const e = live(a[0]); if (!e) return R.int(0); e.exp = nowMs() + parseInt(a[1]) * 1000; return R.int(1); },
  TYPE: a => { argc(a, 1, 'type'); const e = live(a[0]); return R.status(e ? e.type : 'none'); },
  DBSIZE: () => R.int([...DB.keys()].filter(live).length),
  FLUSHALL: () => { DB.clear(); return R.ok; },
  HSET: a => { argc(a, 3, 'hset'); const e = coll(a[0], 'hash', () => new Map()); let n = 0; for (let i = 1; i + 1 < a.length; i += 2) { if (!e.v.has(a[i])) n++; e.v.set(a[i], a[i + 1]); } return R.int(n); },
  HGET: a => { argc(a, 2, 'hget'); const e = needType(a[0], 'hash'); return e && e.v.has(a[1]) ? R.bulk(e.v.get(a[1])) : R.nil; },
  HGETALL: a => { argc(a, 1, 'hgetall'); const e = needType(a[0], 'hash'); return R.arr(e ? [...e.v.entries()].flat().map(R.bulk) : []); },
  HLEN: a => { argc(a, 1, 'hlen'); const e = needType(a[0], 'hash'); return R.int(e ? e.v.size : 0); },
  LPUSH: a => { argc(a, 2, 'lpush'); const e = coll(a[0], 'list', () => []); a.slice(1).forEach(v => e.v.unshift(v)); return R.int(e.v.length); },
  RPUSH: a => { argc(a, 2, 'rpush'); const e = coll(a[0], 'list', () => []); a.slice(1).forEach(v => e.v.push(v)); return R.int(e.v.length); },
  LRANGE: a => { argc(a, 3, 'lrange'); const e = needType(a[0], 'list'); if (!e) return R.arr([]); const L = e.v.length; let s = parseInt(a[1]), t = parseInt(a[2]);
    if (s < 0) s += L; if (t < 0) t += L; s = Math.max(0, s); t = Math.min(L - 1, t); return R.arr(s > t ? [] : e.v.slice(s, t + 1).map(R.bulk)); },
  LLEN: a => { argc(a, 1, 'llen'); const e = needType(a[0], 'list'); return R.int(e ? e.v.length : 0); },
  SADD: a => { argc(a, 2, 'sadd'); const e = coll(a[0], 'set', () => new Set()); let n = 0; a.slice(1).forEach(v => { if (!e.v.has(v)) { e.v.add(v); n++; } }); return R.int(n); },
  SMEMBERS: a => { argc(a, 1, 'smembers'); const e = needType(a[0], 'set'); return R.arr(e ? [...e.v].sort().map(R.bulk) : []); },
  SCARD: a => { argc(a, 1, 'scard'); const e = needType(a[0], 'set'); return R.int(e ? e.v.size : 0); },
  INFO: () => R.bulk(`# Server\r\nvalkey_version:9.0.0 (mock)\r\nvalkey_mode:standalone\r\nuptime_in_seconds:${Math.floor((performance.now() - bootWall) / 1000)}\r\n\r\n# Keyspace\r\ndb0:keys=${[...DB.keys()].filter(live).length},expires=0\r\n`),
  HELP: () => R.arr(['This is a MOCK valkey-cli standing in for try-valkey while the handoff is prototyped.', 'Commands: ' + Object.keys(CMDS).filter(c => c !== 'HELP').join(' ') + ' CLEAR', 'Real try-valkey runs the actual server in a v86 emulator.'].map(R.status)),
};
function tokenize(s) { const out = []; const re = /"((?:[^"\\]|\\.)*)"|'([^']*)'|(\S+)/g; let m; while ((m = re.exec(s))) out.push(m[1] !== undefined ? m[1].replace(/\\(.)/g, '$1') : m[2] !== undefined ? m[2] : m[3]); return out; }
function fmt(r, indent = '') {
  switch (r.t) {
    case 'status': return `<span class="o">${esc(r.v)}</span>`;
    case 'err': return `<span class="e">(error) ${esc(r.v)}</span>`;
    case 'nil': return '<span class="d">(nil)</span>';
    case 'int': return `<span class="o">(integer) ${r.v}</span>`;
    case 'bulk': return r.v.includes('\r\n') ? `<span class="o">${esc(r.v.replace(/\r\n/g, '\n'))}</span>` : `<span class="o">"${esc(r.v)}"</span>`;
    case 'arr': { if (!r.v.length) return '<span class="d">(empty array)</span>';
      const w = String(r.v.length).length; return r.v.map((x, i) => `${i ? indent : ''}${String(i + 1).padStart(w)}) ${fmt(x, indent + ' '.repeat(w + 2))}`).join('\n'); }
  }
}
const tout = document.getElementById('tout'), tbuf = document.getElementById('tbuf'), tin = document.getElementById('tin'), term = document.getElementById('term');
const hist = []; let hi = 0;
function tprint(html) { const d = document.createElement('div'); d.innerHTML = html; tout.appendChild(d); tout.scrollTop = tout.scrollHeight; }
const tprompt = document.getElementById('tprompt');
function promptText() { return tv ? tv.session.prompt() : '127.0.0.1:6379> '; }
function printReply(text) {                                                  // valkey-cli TTY text -> coloured lines
  for (const l of text.replace(/\n$/, '').split('\n')) {
    const cls = l.startsWith('(error)') ? 'e' : (l.startsWith('(nil)') || l.startsWith('(empty')) ? 'd' : 'o';
    tprint(`<span class="${cls}">${esc(l)}</span>`);
  }
}
let termBusy = false;
async function run(line) {
  tprint(`<span class="p">${esc(promptText())}</span>${esc(line)}`);
  if (tv) {                                                                  // the real server
    const c = line.trim().toLowerCase();
    if (!c) return;
    if (c === 'clear') { tout.innerHTML = ''; return; }
    if (c === 'quit' || c === 'exit') { tprint('<span class="d">(this is a browser tab -- just close it)</span>'); return; }
    if (c === 'help' || c === '?') { tprint('<span class="d">A real valkey-server is running in this tab. Try: SET k v · GET k · INCR n · HSET h f v · HGETALL h · LPUSH l a b · LRANGE l 0 -1 · ZADD z 1 a · HELLO 3 · COMMAND DOCS GET</span>'); return; }
    termBusy = true;
    try { printReply(await tv.exec(line)); } finally { termBusy = false; tprompt.textContent = promptText(); }
    return;
  }
  const a = tokenize(line); if (!a.length) return;
  const name = a[0].toUpperCase();
  if (name === 'CLEAR') { tout.innerHTML = ''; return; }
  if (name === 'QUIT' || name === 'EXIT') { tprint('<span class="d">(this is a mock; there is nothing to quit)</span>'); return; }
  try { const f = CMDS[name]; if (!f) throw R.err(`ERR unknown command '${a[0]}', with args beginning with: ${a.slice(1).map(x => `'${x}'`).join(' ')}`); tprint(fmt(f(a.slice(1)))); }
  catch (e) { tprint(e && e.t ? fmt(e) : `<span class="e">(error) ERR ${esc(e.message || e)}</span>`); }
}
// valkey-cli's hints and Tab completion (cli-hints.mjs), fed by the real server's COMMAND DOCS after the handoff.
let helpEntries = [], hintsMod = null, tabState = null;
const thint = document.createElement('span'); thint.id = 'thint'; thint.className = 'd'; document.getElementById('tline').appendChild(thint);
async function initHints() {
  if (!tv) return;
  hintsMod = await import('./cli-hints.mjs');
  const docs = await tv.execRaw('command docs');
  if (docs && docs.elements) helpEntries = hintsMod.buildHelpEntries(docs);
}
function setLine(v) { tin.value = v; tbuf.textContent = v; refreshHint(); }
function refreshHint() { thint.textContent = helpEntries.length && !termBusy ? hintsMod.hintFor(helpEntries, tin.value, l => tv.splitArgs(l)) : ''; }
function tabComplete() {
  if (!helpEntries.length) return;
  if (!tabState) { const list = hintsMod.completionsFor(helpEntries, tin.value); if (!list.length) return; tabState = {original: tin.value, list, idx: 0}; }
  else tabState.idx = (tabState.idx + 1) % (tabState.list.length + 1);              // ... then back to what was typed, like linenoise
  setLine(tabState.idx < tabState.list.length ? tabState.list[tabState.idx] : tabState.original);
}
tin.addEventListener('input', () => { tabState = null; setLine(tin.value); });
tin.addEventListener('keydown', e => {
  if (e.key === 'Tab') { e.preventDefault(); tabComplete(); return; }
  tabState = null;
  if (e.key === 'Enter') { if (termBusy) return; const v = tin.value; setLine(''); thint.textContent = ''; if (v.trim()) { hist.push(v); hi = hist.length; } run(v); }
  else if (e.key === 'ArrowUp') { if (hi > 0) { hi--; setLine(hist[hi]); } e.preventDefault(); }
  else if (e.key === 'ArrowDown') { hi = Math.min(hist.length, hi + 1); setLine(hist[hi] || ''); e.preventDefault(); }
  else if (e.key === 'l' && e.ctrlKey) { tout.innerHTML = ''; e.preventDefault(); }
  else if (e.key === 'c' && e.ctrlKey) { setLine(''); }
});
term.addEventListener('mousedown', e => { if (e.target !== tin) { e.preventDefault(); tin.focus(); } });

/* ============================ CONTROL: the three-phase machine ============================ */
// LOAD (download, open-ended)  -> tape-loader screen + vamp A, layers per download quartile
// SIGN-ON (boot begins)        -> the fixed pre clock: power-on, milestone readout (real markers), wireframe, connections
// HOLD (until server ready)    -> the dominant pedal: vamp B, ports breathing, kernel tail in the corner
// UNLOCK                       -> the post clock: flood, wordmark, tagline, stragglers; handoff at +3.12
// Every transition is quantized to a BAR boundary (0.5s), decided LOOKAHEAD seconds ahead so audio can be booked.
const stage = document.getElementById('stage'), ui = document.getElementById('ui');
const LOOKAHEAD = .3;
const LOAD_MIN = 2.5;                                        // the tape loader is on screen at least this long, however fast the download
const nowS = () => performance.now() / 1000;
let phase = 'idle', score = null, sound = false, handed = false, skipReq = false;
let loadStart = 0, signonStart = 0, audioAt = null;          // audioAt(wallSeconds) -> AudioContext time
let loadBar = 0, loadStopAt = null, holdBar = 0, holdDecided = -1, popped = [false, false, false, false];
const stageT = () => nowS() - signonStart;
const preAnims = () => document.getAnimations().filter(a => !a.effect.target.classList.contains('post'));
const postAnims = () => document.getAnimations().filter(a => a.effect.target.classList.contains('post'));
const at = (wall, fn) => setTimeout(fn, Math.max(0, (wall - nowS()) * 1000));

function loaderTick() { renderLoader(loader.bytes, nowS() - loadStart); if (phase === 'load') requestAnimationFrame(loaderTick); }

function startAll() {
  sound = document.getElementById('sound').checked;
  const name = document.querySelector('input[name=score]:checked').value;
  MODE = document.querySelector('input[name=mode]:checked').value;
  stage.classList.toggle('connect', MODE === 'connect');
  if (sound && name !== 'mute') {
    buildMaster(name, document.getElementById('tape').checked);
    audioAt = w => Math.max(ctx.currentTime + .005, ctx.currentTime + (w - nowS()));
    if (document.getElementById('tape').checked) noise(ctx.currentTime + .05, T.end, {gain: .045, lp: 2400, hp: 120, attack: .4, release: 1.2, color: 'pink'});
    score = SCORES[name]();
  } else { sound = false; score = null; }
  if (REAL) startRealLoader(...loaderParams()); else startLoader(...loaderParams());
  phase = 'load'; loadStart = nowS() + .12; vamp.classList.remove('hold'); vampShow(true); document.body.classList.add('started');
  requestAnimationFrame(loaderTick);
  machine();
}

function machine() {
  if (phase === 'done') return;
  const now = nowS();
  if (phase === 'load') {
    // book vamp-A bars up to the lookahead horizon (and never past a decided transition)
    const layer = Math.min(3, Math.floor(loader.progress * 4));
    for (let b = loadStart + loadBar * BAR; b < now + LOOKAHEAD && (loadStopAt === null || b < loadStopAt); b = loadStart + (++loadBar) * BAR)
      if (score) score.vampLoad(audioAt(b), loadBar, layer);
    // download complete -> the sign-on starts on the next bar boundary the audio hasn't been booked past, and never before LOAD_MIN
    if (loadStopAt === null && loader.phase !== 'download') {
      const earliest = Math.max(now + LOOKAHEAD, loadStart + LOAD_MIN);
      loadStopAt = loadStart + Math.max(loadBar, Math.ceil((earliest - loadStart) / BAR)) * BAR;
      if (score) score.pre(audioAt(loadStopAt));
      at(loadStopAt, beginSignon);
    }
  } else if (phase === 'signon') {
    const t = stageT();
    // milestone pops: on the beat if the real marker has arrived, else the moment it does
    for (let i = 0; i < 4; i++) if (!popped[i] && t >= T.boot[i] + T.status && loader.marks[i]) {
      popped[i] = true; document.querySelectorAll('#boot .st')[i].classList.add('on'); if (score) score.status(ctx.currentTime + .02, i);
    }
    // the hold: bars at holdMin + k*BAR; each is either the unlock or one more bar of the pedal, decided LOOKAHEAD early
    if (t >= T.click && !loader.ready) { vamp.classList.add('hold'); vampShow(true); }
    for (let b = signonStart + T.holdMin + holdBar * BAR; b < now + LOOKAHEAD; b = signonStart + T.holdMin + (++holdBar) * BAR) {
      if (loader.ready) { unlockAt(b); break; }
      if (score) score.vampHold(audioAt(b), holdBar);
    }
  }
  setTimeout(machine, 50);
}

function beginSignon() {
  phase = 'signon'; signonStart = nowS(); netStart = signonStart * 1000;
  vampShow(false); vamp.classList.remove('hold'); sizeCanvas(); cx2.clearRect(0, 0, 900, 500);
  stage.classList.add('play');
  netRunning = true; requestAnimationFrame(netTick);
  if (skipReq) jumpPre(T.click);
}
function unlockAt(wall) {
  phase = 'post'; UNLOCK.at = wall - signonStart;
  if (score) score.post(audioAt(wall));
  at(wall, () => { stage.classList.add('unlock'); vampShow(false); if (skipReq) { jumpPost(T.P.hand); handoff(); } });
  if (!skipReq) at(wall + T.P.hand, handoff);
}
function jumpPre(to) { const j = to - stageT(); if (j <= 0) return; signonStart -= j; netStart = signonStart * 1000; preAnims().forEach(a => { if (a.currentTime !== null) a.currentTime += j * 1000; }); }
function jumpPost(to) { const j = to - (stageT() - UNLOCK.at); if (j <= 0) return; signonStart -= j; netStart = signonStart * 1000; UNLOCK.at += 0; postAnims().forEach(a => { if (a.currentTime !== null) a.currentTime += j * 1000; }); preAnims().forEach(a => { if (a.currentTime !== null) a.currentTime += j * 1000; }); }

function stopAudio(fadeSecs) {
  if (!ctx) return; const c = ctx, m = master;
  try { m.gain.setValueAtTime(m.gain.value, c.currentTime); m.gain.linearRampToValueAtTime(0, c.currentTime + fadeSecs); } catch (e) {}
  setTimeout(() => { if (ctx === c) { c.close(); ctx = null; } }, fadeSecs * 1000 + 100);
}
function handoff() {
  if (handed) return; handed = true; phase = 'done'; HAND.at = stageT(); vampShow(false); netLastT = HAND.at;
  document.body.classList.add('hand'); stopAudio(1.8);
  // the picture shrinks (CSS transition on #frame width); the terminal fades in as it lands
  setTimeout(() => {
    document.body.classList.add('termon'); bootWall = performance.now();
    if (tv) {
      for (const l of loader.lines.filter(l => /Server initialized|Ready to accept connections/.test(l))) tprint(`<span class="d">${esc(l.replace(/^\d+:M \d+ \w+ \d+ [\d:.]+ /, '1:M '))}</span>`);
      tprompt.textContent = promptText();
      initHints();
      const pushes = outs => { if (outs.length) { outs.forEach(printReply); } };
      tv.exec.onUnsolicited = pushes;
      setInterval(() => pushes(tv.tick()), 50);                              // serverCron, expiry, blocking timeouts, pub/sub
    } else { tprint('<span class="d">1:M * Server initialized</span>'); tprint('<span class="d">1:M * Ready to accept connections tcp</span>'); }
    tprint('&nbsp;'); tin.focus();
  }, 900);
}
function skipIntro() {                                   // skip = get to the terminal as soon as the server allows
  if (handed) return; skipReq = true; stopAudio(.5);
  if (phase === 'signon') jumpPre(T.click);
  else if (phase === 'post' && stageT() >= UNLOCK.at) { jumpPost(T.P.hand); handoff(); }
}

const q = new URLSearchParams(location.search);
const dlIn = document.getElementById('dl'), bootIn = document.getElementById('boot');
function loaderParams() { return [parseFloat(q.get('dl') ?? dlIn.value), parseFloat(q.get('boot') ?? bootIn.value)]; }
document.getElementById('start').onclick = () => { ui.classList.add('hidden'); startAll(); };
document.getElementById('skipstart').onclick = () => { ui.classList.add('hidden'); startAll(); skipReq = true; };
document.getElementById('skip').onclick = skipIntro;
document.addEventListener('keydown', e => { if (e.key === 'Escape') skipIntro(); });
document.getElementById('replay').onclick = () => location.reload();
document.getElementById('replay2').onclick = () => location.reload();
// presets <-> number inputs
document.querySelectorAll('input[name=preset]').forEach(r => r.addEventListener('change', () => { const [d, b] = r.value.split(','); dlIn.value = d; bootIn.value = b; }));
{ const [d, b] = document.querySelector('input[name=preset]:checked').value.split(','); dlIn.value = q.get('dl') ?? d; bootIn.value = q.get('boot') ?? b; }

// DEBUG: ?run=1[&dl=&boot=&mode=&sound=fm|sid|turbine|launch] starts everything without a gesture (audio stays suspended;
//        scheduling exceptions surface in the console). ?t=SECONDS freezes the sign-on at that stage time, with
//        &unlock_at= (default 3.18) for the post clock, &load=PCT for the tape-loader screen, &vamp=boot for the hold corner,
//        &hand=1 for the post-handoff static state.
if (q.get('run')) {
  ui.classList.add('hidden');
  if (q.get('sound')) { document.getElementById('sound').checked = true; document.querySelector(`input[name=score][value=${q.get('sound')}]`).checked = true; }
  if (q.get('mode')) document.querySelector(`input[name=mode][value=${q.get('mode')}]`).checked = true;
  try { startAll(); console.log('started', MODE, sound ? document.querySelector('input[name=score]:checked').value : 'silent'); } catch (e) { console.error('START ERROR', e); }
}
if (q.get('t') !== null) {
  const seek = parseFloat(q.get('t')), uAt = parseFloat(q.get('unlock_at') || T.holdMin);
  MODE = q.get('mode') || MODE; netStop(); ui.classList.add('hidden'); stage.classList.toggle('connect', MODE === 'connect');
  if (q.get('load') !== null) { loader.phase = 'download'; loader.progress = parseFloat(q.get('load')); loader.bytes = loader.progress * loader.total; loader.lastBytesAt = performance.now(); vamp.innerHTML = vampText(); vamp.classList.add('on'); renderLoader(loader.bytes, seek); }
  else {
    stage.classList.add('play'); UNLOCK.at = uAt;
    if (q.get('vamp') === 'boot') { loader.phase = 'boot'; loader.lines = BOOT_LINES.slice(0, 12); vamp.innerHTML = vampText(); vamp.classList.add('on', 'hold'); }
    document.querySelectorAll('#boot .st').forEach((el, i) => { if (seek >= T.boot[i] + T.status && (q.get('vamp') !== 'boot' || i < 2)) el.classList.add('on'); });
    if (q.get('hand') === '1') { HAND.at = uAt + T.P.hand; document.body.classList.add('hand', 'termon'); tprint('<span class="d">1:M * Server initialized</span>'); tprint('<span class="d">1:M * Ready to accept connections tcp</span>'); tprint('&nbsp;'); }
    requestAnimationFrame(() => {
      preAnims().forEach(a => { a.pause(); a.currentTime = seek * 1000; });
      if (seek >= uAt) { stage.classList.add('unlock'); requestAnimationFrame(() => postAnims().forEach(a => { a.pause(); a.currentTime = (seek - uAt) * 1000; })); }
      netLastT = seek; renderNet(seek);
    });
  }
}
</script>
